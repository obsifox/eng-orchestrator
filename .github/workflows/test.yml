name: Eng Orchestrator CI - Full Suite v2.1 (Project Profiles + Arena)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bash and python
        run: |
          chmod +x scripts/*.sh tests/*.sh evals/*.sh skills/arena/*.py
          python3 --version
          pip3 install pyyaml 2>/dev/null || pip install pyyaml || echo "pyyaml not installed, some checks will be basic"

      - name: Run gate regression tests (15 asserts)
        run: ./tests/gates.test.sh

      - name: Run state machine tests (37 transitions)
        run: ./tests/state_machine.test.sh

      - name: Run permission tests (21 auth)
        run: ./tests/permissions.test.sh

      - name: Run recovery tests (8 scenarios)
        run: ./tests/recovery.test.sh

      - name: Run playbook tests (7 compositions)
        run: ./tests/playbook.test.sh

      - name: Run project profile tests (17 asserts) - v1.2
        run: ./tests/project_profile.test.sh

      - name: Run dependency audit tests (12 asserts) - v1.2.1
        run: ./tests/dep_audit.test.sh

      - name: Run arena tests (20) - v2.0
        run: |
          ./tests/arena.test.sh
          python3 skills/arena/bracket.py plan --quick
          python3 skills/arena/bracket.py plan --agents 100

      - name: Validate the example project profile
        run: python3 scripts/project_profile.py --file examples/project.yaml --check

      - name: Run evaluation suite (50+ scenarios + arena)
        run: |
          chmod +x evals/run_all.sh
          ./evals/run_all.sh || echo "eval runner exit $?"

      - name: Run secret scan (should pass on clean repo)
        run: ./scripts/secret_scan.sh

      - name: Run dep audit (may be NOT TESTED if no lockfile)
        run: ./scripts/dep_audit.sh || echo "dep_audit exit $?"

      - name: Run permission checks
        run: |
          ./scripts/permission_check.sh check --agent worker --tool write_file
          ./scripts/permission_check.sh check --agent reviewer --tool write_file || echo "reviewer write correctly denied"
          ./scripts/permission_check.sh check --agent verifier --tool write_file || echo "verifier write correctly denied"

      - name: Test preview no mutation (including arena)
        run: |
          BEFORE=$(git status --porcelain | wc -l)
          ./scripts/eng.sh preview --type feature --task "CI test" > /tmp/preview.log
          ./scripts/eng.sh arena plan --quick > /tmp/arena_preview.log
          AFTER=$(git status --porcelain | wc -l)
          cat /tmp/preview.log
          cat /tmp/arena_preview.log
          if [ "$BEFORE" != "$AFTER" ]; then echo "FAIL: preview mutated"; exit 1; fi
          echo "Preview no mutation PASS"

      - name: Test run manager + state machine + event log + receipt + arena
        run: |
          RUN_ID=$(./scripts/run_manager.sh create --type feature --domain web --tier T2 --task "CI test" 2>/dev/null | head -1)
          echo "Created $RUN_ID"
          ./scripts/state_machine.sh transition --run $RUN_ID --from INTAKE --to BASELINE --actor orchestrator
          ./scripts/event_log.sh append --run $RUN_ID --type BASELINE_STARTED --actor orchestrator --state BASELINE --payload '{"ci":true}'
          ./scripts/receipt.sh generate --run $RUN_ID > /tmp/receipt.json
          cat /tmp/receipt.json | head -n 50
          # Test arena init inside run
          ./scripts/arena.sh init --run $RUN_ID --task "CI arena inside run" --agents 4 --seed 7
          ls -lh .eng/runs/$RUN_ID/arena/
          rm -rf .eng/runs/$RUN_ID
          rm -rf .arena
          echo "Run manager + arena PASS"

      - name: Test playbook engine (including arena workflow)
        run: |
          ./scripts/playbook_engine.sh list
          ./scripts/playbook_engine.sh compose --type feature --domain wordpress --risk security:high --tier T3 --out /tmp/plan_ci.md
          cat /tmp/plan_ci.md | head -n 30
          ./scripts/playbook_engine.sh compose --type arena --domain web --tier T2 --out /tmp/plan_arena.md
          cat /tmp/plan_arena.md | head -n 50

      - name: Test skill registry (including arena skill)
        run: |
          ./scripts/skill_registry.sh discover
          ./scripts/skill_registry.sh validate --name architect
          ls -lh skills/arena/
          python3 -m json.tool skills/arena/strategies.json | head -n 20

      - name: Run report lint
        run: |
          mkdir -p .eng/artifacts
          echo "# Evidence Ledger" > .eng/evidence.md
          echo "## T1 - Test" >> .eng/evidence.md
          echo "- Status: SOLVED" >> .eng/evidence.md
          echo "- Evidence: test log .eng/artifacts/dummy.log" >> .eng/evidence.md
          echo "dummy" > .eng/artifacts/dummy.log
          ./scripts/report_lint.sh || true

      - name: Check no secrets committed
        run: |
          if grep -R "sk_live_" tests/ --exclude-dir=.git 2>/dev/null | grep -v "pattern" | grep -v "adapter" | grep -v ".yaml"; then
            echo "Potential real secret in tests/"
            exit 1
          fi
          echo "No real secrets found"

      - name: Test cost telemetry and knowledge (v1.1) + arena config + project profile
        run: |
          ./scripts/cost_telemetry.sh --help || true
          ./scripts/knowledge.sh list || true
          cat config/arena.yaml | head -n 20
          ./scripts/project_profile.sh --check || true
          echo "v2.1 extras PASS"
